services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: lde_dev
      POSTGRES_USER: lde_dev
      POSTGRES_PASSWORD: ${LDE_LOCAL_DB_PASSWORD:?Run npm run setup:local first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - lde_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lde_dev -d lde_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  lde_local:
