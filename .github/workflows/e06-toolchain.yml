name: E06 isolated toolchain preparation
on:
  pull_request:
    paths: ['.github/workflows/e06-toolchain.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Resolve candidate UI dependencies (not merge acceptance)
        run: |
          npm install --ignore-scripts --save-exact react@19 react-dom@19
          npm install --ignore-scripts --save-dev --save-exact @types/react@19 @types/react-dom@19 esbuild@0.25 @playwright/test@1 @axe-core/playwright@4
          npm audit --audit-level=high
          mkdir -p artifacts
          cp package.json package-lock.json artifacts/
          tar -czf artifacts/dependencies.tar.gz node_modules
      - name: Prepare isolated browser runtime
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/e06-browsers
        run: |
          npx --no-install playwright install chromium
          tar -C /tmp -czf artifacts/browsers.tar.gz e06-browsers
      - name: Prepare official PostgreSQL 18 runtime for local-only tests
        run: |
          container=$(docker create postgres:18)
          mkdir -p /tmp/e06-pg/usr/lib /tmp/e06-pg/usr/share /tmp/e06-pg/lib
          docker cp "$container:/usr/lib/postgresql" /tmp/e06-pg/usr/lib/
          docker cp "$container:/usr/share/postgresql" /tmp/e06-pg/usr/share/
          docker cp "$container:/usr/lib/x86_64-linux-gnu" /tmp/e06-pg/lib/
          docker rm "$container"
          tar -C /tmp -czf artifacts/postgres.tar.gz e06-pg
          sha256sum artifacts/*.tar.gz > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e06-toolchain
          path: artifacts/
          retention-days: 2
          if-no-files-found: error
