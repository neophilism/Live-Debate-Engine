name: Prepare E06 UI dependencies
on:
  push:
    branches: [feat/e06-reusable-interface]
    paths: [.github/workflows/prepare-e06-ui.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Produce a dependency candidate for review, not merge acceptance
        run: |
          npm install --ignore-scripts --save-exact react@19.3.0 react-dom@19.3.0
          npm install --ignore-scripts --save-dev --save-exact esbuild@0.28.2 playwright@1.64.0 axe-core @types/react @types/react-dom
          mkdir -p artifacts
          cp package.json package-lock.json artifacts/
          sha256sum package-lock.json > artifacts/lock.sha256
          npm ls --all --json > artifacts/dependency-tree.json
          npm audit --json > artifacts/audit.json || true
          tar -czf artifacts/node-modules.tgz node_modules
          git rev-parse HEAD > artifacts/source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e06-ui-dependency-candidate
          path: artifacts/
          retention-days: 2
          if-no-files-found: error
