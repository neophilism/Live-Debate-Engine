name: E04 local test runtime (not acceptance)
on:
  pull_request:
    paths: ['.github/workflows/e04-local-test-runtime.yml']
permissions:
  contents: read
jobs:
  runtime:
    if: github.head_ref == 'feat/e04-identity-authorization'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Package the official PostgreSQL 18 test binaries and shared libraries
        run: |
          mkdir -p runtime
          docker pull postgres:18
          docker image inspect postgres:18 --format '{{json .RepoDigests}}' > runtime/image-digest.json
          docker run --rm --entrypoint /bin/sh -v "$PWD/runtime:/out" postgres:18 -c '
            set -eu
            mkdir -p /tmp/pg-runtime/deps
            for p in /usr/lib/postgresql/18/bin/postgres /usr/lib/postgresql/18/bin/initdb /usr/lib/postgresql/18/bin/pg_ctl /usr/lib/postgresql/18/bin/psql; do
              ldd "$p" | awk "\$3 ~ /^\\// {print \$3}"
            done | sort -u | while read lib; do cp -L "$lib" /tmp/pg-runtime/deps/; done
            tar -czf /out/postgres18-runtime.tgz -C / usr/lib/postgresql/18 usr/share/postgresql/18 -C /tmp/pg-runtime deps
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e04-local-postgres-runtime
          path: runtime/
          retention-days: 1
          if-no-files-found: error
      - run: echo 'For disposable local tests only. Not deployment or acceptance evidence. Remove this temporary workflow before merge.'
