name: E04 dependency candidate (not acceptance)
on:
  pull_request:
    paths: ['package.json', '.github/workflows/e04-dependency-candidate.yml']
permissions:
  contents: read
jobs:
  candidate:
    if: github.head_ref == 'feat/e04-identity-authorization'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare candidate lock and installed public dependencies for review
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          mkdir -p candidate
          cp package-lock.json candidate/package-lock.json
          npm ls --json > candidate/dependencies.json
          tar -czf candidate/node_modules.tgz node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e04-dependency-candidate
          path: candidate/
          retention-days: 1
          if-no-files-found: error
      - name: Candidate generation is not merge acceptance
        run: echo 'Review and commit the lockfile; existing required CI must pass. Remove this preparation workflow before merge.'
