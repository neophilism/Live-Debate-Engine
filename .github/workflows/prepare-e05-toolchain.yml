name: Prepare E05 isolated toolchain
on:
  push:
    branches: [feat/e05-protected-objects]
    paths: [.github/workflows/prepare-e05-toolchain.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Package exact locked dependencies and official disposable PostgreSQL runtime
        run: |
          mkdir -p artifacts pg-runtime
          sha256sum package-lock.json > artifacts/lock.sha256
          git rev-parse HEAD > artifacts/source-sha.txt
          tar -czf artifacts/node-modules.tgz node_modules
          docker pull postgres:18-bookworm
          docker image inspect postgres:18-bookworm --format '{{json .RepoDigests}}' > artifacts/postgres-image.json
          docker create --name lde-toolchain postgres:18-bookworm
          docker cp lde-toolchain:/usr/lib/postgresql pg-runtime/postgresql
          docker cp lde-toolchain:/usr/share/postgresql pg-runtime/share
          docker cp lde-toolchain:/usr/lib/x86_64-linux-gnu pg-runtime/lib
          docker rm lde-toolchain
          tar -czf artifacts/postgres-runtime.tgz pg-runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e05-isolated-toolchain
          path: artifacts/
          retention-days: 2
          if-no-files-found: error
